<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>AstroFotos - Galeria</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .card pre {
      margin: 0;
      padding: 8px;
      font-size: 0.75rem;
      white-space: pre-wrap;
      background: #f4f4f4;
      max-height: 120px;
      overflow: auto;
    }
    #status {
      margin-top: 16px;
      display: none;
    }
    #status.error {
      color: #611a15;
    }
  </style>
</head>
<body>
  <h1>Galeria de fotos</h1>
  <p id="status"></p>
  <div id="grid"></div>

  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');

    async function loadPhotos() {
      status.style.display = 'block';
      status.classList.remove('error');
      status.textContent = 'Carregando...';

      try {
        const response = await fetch('/photo');
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Erro ao buscar as fotos');
        }

        const photos = data.photos || [];
        if (photos.length === 0) {
          status.textContent = 'Nenhuma foto encontrada.';
          return;
        }

        status.style.display = 'none';
        grid.innerHTML = '';
        photos.forEach((photo, i) => {
          const card = document.createElement('div');
          card.className = 'card';

          const img = document.createElement('img');
          img.src = `data:${data.mimeType[i]};base64,${photo}`;
          card.appendChild(img);

          const pre = document.createElement('pre');
          pre.textContent = JSON.stringify(data.metadatas[i], null, 2);
          card.appendChild(pre);

          grid.appendChild(card);
        });
      } catch (error) {
        status.classList.add('error');
        status.textContent = error.message;
      }
    }

    loadPhotos();
  </script>
</body>
</html>
